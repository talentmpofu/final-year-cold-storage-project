<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#grad512)"/>
  
  <!-- Snowflake icon -->
  <g transform="translate(256, 256)" fill="white" stroke="white" stroke-width="4" stroke-linecap="round">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="20"/>
    
    <!-- Vertical line -->
    <rect x="-8" y="-120" width="16" height="240" rx="8"/>
    
    <!-- Horizontal line -->
    <rect x="-120" y="-8" width="240" height="16" rx="8"/>
    
    <!-- Diagonal line 1 -->
    <rect x="-8" y="-120" width="16" height="240" rx="8" transform="rotate(45)"/>
    
    <!-- Diagonal line 2 -->
    <rect x="-8" y="-120" width="16" height="240" rx="8" transform="rotate(-45)"/>
    
    <!-- Top arms -->
    <path d="M 0,-120 L -20,-95 M 0,-120 L 20,-95" stroke-width="8" fill="none"/>
    <path d="M -120,0 L -95,-20 M -120,0 L -95,20" stroke-width="8" fill="none"/>
    <path d="M 120,0 L 95,-20 M 120,0 L 95,20" stroke-width="8" fill="none"/>
    <path d="M 0,120 L -20,95 M 0,120 L 20,95" stroke-width="8" fill="none"/>
    
    <path d="M -85,-85 L -100,-65 M -85,-85 L -65,-100" stroke-width="8" fill="none"/>
    <path d="M 85,-85 L 65,-100 M 85,-85 L 100,-65" stroke-width="8" fill="none"/>
    <path d="M -85,85 L -100,65 M -85,85 L -65,100" stroke-width="8" fill="none"/>
    <path d="M 85,85 L 65,100 M 85,85 L 100,65" stroke-width="8" fill="none"/>
  </g>
  
  <!-- "COLD STORAGE" text -->
  <text x="256" y="410" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">COLD</text>
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="32" font-weight="normal" fill="white" text-anchor="middle" opacity="0.9">STORAGE</text>
</svg>
