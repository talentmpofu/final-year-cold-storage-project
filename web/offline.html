<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Cold Storage Monitor</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 500px;
      }
      .icon {
        font-size: 80px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 32px;
        margin: 0 0 15px 0;
      }
      p {
        font-size: 16px;
        line-height: 1.6;
        opacity: 0.9;
      }
      button {
        background: white;
        color: #667eea;
        border: none;
        padding: 15px 30px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 20px;
      }
      button:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      }
      .offline-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: #ef4444;
        border-radius: 50%;
        margin-right: 8px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">❄️</div>
      <h1>You're Offline</h1>
      <p>
        <span class="offline-indicator"></span>
        No internet connection detected
      </p>
      <p>
        Your Cold Storage Monitor needs an internet connection to load fresh
        data. Don't worry - the system will automatically reconnect when your
        connection is restored.
      </p>
      <button onclick="location.reload()">Try Again</button>
      <p style="font-size: 14px; margin-top: 30px; opacity: 0.7">
        💡 Tip: Make sure your WiFi or mobile data is enabled
      </p>
    </div>

    <script>
      // Auto-reload when back online
      window.addEventListener("online", () => {
        console.log("🌐 Connection restored!");
        location.reload();
      });
    </script>
  </body>
</html>
